# Netlify configuration for Mercedes AI Agent

[build]
  # Location of your serverless functions
  functions = "netlify/functions"
  # Publish directory (where your HTML lives)
  publish = "."

# Redirect function calls to the right endpoint
[[redirects]]
  from = "/api/mercedes"
  to = "/.netlify/functions/mercedes"
  status = 200

# Configure CORS headers
[[headers]]
  for = "/api/mercedes"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Environment variables (add via Netlify dashboard, not here)
# Never commit secrets to GitHub!
# [context.production.environment]
#   MAKE_WEBHOOK_URL = "https://hook.make.com/..."
